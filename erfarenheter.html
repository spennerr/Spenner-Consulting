      </div>
    </section>

    
    <section class="py-16 sm:py-20">
      <div class="mx-auto max-w-6xl px-4 sm:px-6">

        <span class="mb-4 block h-1 w-14 rounded-full bg-accent"></span>
        <h2 id="expTitle" class="font-display text-3xl font-bold tracking-tight text-navy sm:text-4xl" data-i18n="exp.ganttTitle">Min yrkesbana, i ett Gantt-schema</h2>

        
        <div class="mt-10 flex flex-wrap items-center gap-2" role="group" aria-label="Filtrera">
          <button type="button" data-gantt-filter="all" aria-pressed="true" class="inline-flex items-center gap-2 rounded-full border border-accentlight bg-accentlight px-4 py-2 text-sm font-semibold text-navy transition" data-i18n="exp.filterAll">Alla</button>
          <button type="button" data-gantt-filter="anst" aria-pressed="false" class="inline-flex items-center gap-2 rounded-full border border-navy/25 bg-white px-4 py-2 text-sm font-semibold text-navy transition hover:-translate-y-0.5 hover:border-accentlight hover:bg-accentlight hover:text-navy"><span class="h-3 w-6 rounded-sm bg-gantt-anst"></span> <span data-i18n="exp.filterAnst">Anställningar</span></button>
          <button type="button" data-gantt-filter="uppd" aria-pressed="false" class="inline-flex items-center gap-2 rounded-full border border-navy/25 bg-white px-4 py-2 text-sm font-semibold text-navy transition hover:-translate-y-0.5 hover:border-accentlight hover:bg-accentlight hover:text-navy"><span class="h-3 w-6 rounded-sm bg-gantt-uppd"></span> <span data-i18n="exp.filterUppd">Uppdrag</span></button>
          <button type="button" data-gantt-filter="edu" aria-pressed="false" class="inline-flex items-center gap-2 rounded-full border border-navy/25 bg-white px-4 py-2 text-sm font-semibold text-navy transition hover:-translate-y-0.5 hover:border-accentlight hover:bg-accentlight hover:text-navy"><span class="h-3 w-6 rounded-sm bg-gantt-edu"></span> <span data-i18n="exp.filterEdu">Utbildningar</span></button>
        </div>

        <div class="mt-5 flex flex-wrap items-center gap-2" role="group" aria-label="Välj visning">
          <button type="button" data-view-toggle="gantt" aria-pressed="true" class="rounded-none border-2 border-accentlight bg-accentlight px-6 py-3 text-base font-semibold text-navy transition hover:-translate-y-0.5" data-i18n="exp.viewGantt">Tidslinje</button>
          <button type="button" data-view-toggle="list" aria-pressed="false" class="rounded-none border-2 border-navy/25 bg-white px-6 py-3 text-base font-semibold text-navy transition hover:-translate-y-0.5 hover:border-accentlight hover:bg-accentlight hover:text-navy" data-i18n="exp.viewList">Lista</button>
        </div>

        <div id="ganttPanel" class="mt-8 pb-4">
          <div>
            
            <div class="flex gap-6">
              <div class="w-64 shrink-0 text-xs font-semibold uppercase tracking-wider text-slate" data-i18n="exp.axisYear">År</div>
              <div class="relative h-9 flex-1 text-[11px] font-semibold uppercase tracking-wider text-slate" id="ganttAxis"></div>
            </div>

            
            <div id="ganttRows"></div>
          </div>
        </div>

        <div id="ganttList" class="mt-10 hidden"></div>
        </div>
      </div>

          <p id="ganttModalPlace" class="mt-1 text-sm text-slate"></p>
        </div>
        <button type="button" data-gantt-close aria-label="Stäng" class="shrink-0 rounded-none border border-navy/20 bg-bg p-2 text-navy transition hover:-translate-y-0.5 hover:border-accentlight hover:bg-accentlight hover:text-navy">
